[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/create-order"
  to = "/.netlify/functions/create-order"
  status = 200

[[redirects]]
  from = "/api/verify-payment"
  to = "/.netlify/functions/verify-payment"
  status = 200

[[redirects]]
  from = "/api/razorpay-webhook"
  to = "/.netlify/functions/razorpay-webhook"
  status = 200

[[redirects]]
  from = "/api/webhook"
  to = "/.netlify/functions/razorpay-webhook"
  status = 200

[[redirects]]
  from = "/api/download-product"
  to = "/.netlify/functions/download-product"
  status = 200

[[redirects]]
  from = "/api/admin/refund"
  to = "/.netlify/functions/admin-refund"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
